# ==============================================================================
# Agent Controller Configuration
# Milestone 17.2: Agentic Orchestration Layer
# ==============================================================================

version: "1.0.0"

# Bounded Execution Limits
limits:
  max_attempts: 2                 # Strict maximum attempts per step (never unbounded)
  max_retrieval_results: 3        # Number of historical evidence candidates to retrieve

# Engineering Heuristic Thresholds (treated as heuristic gating, not calibrated probabilities)
thresholds:
  intent_confidence_threshold: 0.50       # Minimum classifier confidence for self-service
  retrieval_similarity_threshold: 0.35    # Sufficient evidence cosine similarity threshold
  borderline_retrieval_threshold: 0.25    # Lower bound to trigger query augmentation retry

# Query Augmentation Strategy for Retrieval Retry
query_augmentation:
  enabled: true
  use_intent_keywords: true
  min_confidence_for_augmentation: 0.50

# Fallback Routing Queues
routing_targets:
  self_service: "self_service"
  safety_team: "safety_team"
  account_security: "account_security"
  hardware_repair: "hardware_repair"
  billing_support: "billing_support"
  general_support: "general_support"
